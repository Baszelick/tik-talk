@if (post(); as post) {
<app-avatar-circle class="size32" [avatarUrl]="post.author.avatarUrl">
</app-avatar-circle>

<main class="post-body custom-scrollbar">
  <div class="post-header">
    <strong class="post__author">
      {{ post.author.firstName }} {{ post.author.lastName }}
      <span class="post-created-at">{{ post.createdAt | timeAgo }}</span>
    </strong>
  </div>
  <p class="medium-text post-content">{{ post.content }}</p>

  <div class="post-counters">
    <span class="comment-amount">
      <svg icon="comment" class="svg16"></svg>
      <span class="comments-length">{{ comments().length }}</span>
    </span>
  </div>

  <div class="post__comments-wrapper custom-scrollbar">
    @for (comment of comments(); track comment.id) {
    <app-comment [comment]="comment"></app-comment>
    }
  </div>

  <app-post-input
    (created)="onCreated($event)"
    [postId]="post.id"
    [isCommentInput]="true"
  ></app-post-input>
</main>
}
