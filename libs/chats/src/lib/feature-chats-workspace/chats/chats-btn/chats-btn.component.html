@if (chat(); as chat) {
<app-avatar-circle
  class="size32"
  [avatarUrl]="chat.userFrom.avatarUrl"
></app-avatar-circle>

<div class="last-message__wrapper">
  <div class="chat-user medium-text">
    <span>{{ chat.userFrom.firstName }} {{ chat.userFrom.lastName }}</span>
    <span>{{ chat.createdAt | date : 'dd.MM.YYYY' }}</span>
    @if (chat.unRead && chat.unRead > 0) {
      <span class="unread-badge">
        {{ chat.unRead }}
      </span>
    }
  </div>
  <div class="medium-text">{{ chat.message ?? '...' }}</div>
</div>
}
